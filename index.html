<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: une colonne de lecture (720px), barre de navigation fixe en bas comme une appli, chronologie du jour avec colonne d'heures à gauche. */
:root {
  --bg: #EDF0F1;
  --surface: #FFFFFF;
  --surface2: #E3E8EA;
  --ink: #0F1E26;
  --muted: #56686F;
  --line: #D2DADD;
  --accent: #0B6B73;
  --accent-ink: #FFFFFF;
  --accent-soft: #D6ECEE;
  --warn: #8A5200;
  --warn-soft: #FBEBCF;
  --bad: #B3261E;
  --ok: #1F7A4D;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C151A; --surface: #121F26; --surface2: #1A2B33; --ink: #E6EEF1; --muted: #8FA3AC; --line: #243640;
    --accent: #5CC8CF; --accent-ink: #06262A; --accent-soft: #123940; --warn: #F0B45A; --warn-soft: #33260F; --bad: #F2877F; --ok: #62C48F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C151A; --surface: #121F26; --surface2: #1A2B33; --ink: #E6EEF1; --muted: #8FA3AC; --line: #243640;
  --accent: #5CC8CF; --accent-ink: #06262A; --accent-soft: #123940; --warn: #F0B45A; --warn-soft: #33260F; --bad: #F2877F; --ok: #62C48F;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.015em; line-height: 1.15; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 600; line-height: 1.3; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); }
small.sub { display: block; font-size: 12px; font-weight: 400; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top p { color: var(--muted); font-size: 13px; }
.top p::first-letter { text-transform: uppercase; }
button:focus-visible, input:focus-visible, select:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 2px; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 2px; min-height: 52px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 4px 0; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.summary { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; }
.summary b { color: var(--ink); font-weight: 600; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.panel h3.title { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.coach { display: grid; gap: 10px; }
.msg { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.msg i { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--accent); }
.msg.warn i { background: var(--warn); }
.msg.ok i { background: var(--ok); }
.notice { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; display: flex; gap: 12px; justify-content: space-between; align-items: start; }
.notice.warn { background: var(--warn-soft); }
.panel.focus { border-color: var(--accent); }
.clock { font-size: 40px; font-weight: 500; letter-spacing: -0.02em; }

.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.blk { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
.blk .t { display: grid; align-content: start; font-family: var(--font-mono); font-size: 13px; padding-top: 12px; font-variant-numeric: tabular-nums; }
.blk .t span + span { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.blk.first .card { border-color: var(--accent); }
.tag { justify-self: start; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--accent); }
.row { display: flex; gap: 10px; justify-content: space-between; align-items: start; min-width: 0; }
.row h3 { overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.why { font-size: 14px; }
.blk.pause .card { background: transparent; border-style: dashed; color: var(--muted); padding-block: 8px; }
.blk.event .card { background: repeating-linear-gradient(135deg, var(--surface2) 0 8px, var(--bg) 8px 16px); border-style: dashed; }

.btn { font: inherit; font-weight: 600; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.group { display: grid; gap: 8px; }
.group h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; min-width: 0; }
.item p { font-size: 14px; color: var(--muted); }
form, .form { display: grid; gap: 12px; }
label.f, .f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type="text"], input[type="time"], input[type="date"], select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; min-height: 42px; padding: 0 10px; width: 100%; min-width: 0;
}
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: inherit; font-size: 14px; font-weight: 500; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.seg button.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.err { color: var(--bad); font-size: 13px; }
.rank { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.badge { font-size: 12px; font-weight: 600; color: var(--warn); }
.empty { color: var(--muted); }
.done-t { text-decoration: line-through; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }

.sw-row { align-items: center; }
.sw { flex: none; width: 46px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface2); position: relative; cursor: pointer; padding: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); }
.sw.on { background: var(--accent); border-color: var(--accent); }
.sw.on::after { left: 21px; background: var(--accent-ink); }

.bar { height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.over i { background: var(--warn); }
.day { display: grid; gap: 6px; }
.dtask { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.dtask span:first-child { min-width: 0; overflow-wrap: anywhere; }
.hist { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
.hist div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
.hist div.hot { opacity: 1; }
.hlab { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.cat { display: grid; grid-template-columns: 92px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; }
.cat span:last-child { text-align: right; }
@media (prefers-reduced-motion: no-preference) { .btn, .seg button, .sw, .sw::after { transition: background .15s, border-color .15s, left .15s; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  'use strict';
  var KEY = 'cadence.v2';
  var app = document.getElementById('app');
  var CATS = ['Clients', 'Marketing', 'Admin', 'Production', 'Perso'];
  var PEAK = { matin: [480, 720], aprem: [780, 1020], soir: [1080, 1320] };
  var PEAKLBL = { matin: 'Matin', aprem: 'Après-midi', soir: 'Soir' };
  var ENLBL = { basse: 'Basse', moyenne: 'Normale', haute: 'Haute' };
  var IMP = ['', 'Faible', 'Normale', 'Haute'];
  var EFF = ['', 'Léger', 'Moyen', 'Exigeant'];
  var REP = { once: 'Une fois', daily: 'Tous les jours', weekdays: 'Jours ouvrés', weekly: 'Chaque semaine' };
  var RECL = { '': 'Ne se répète pas', d: 'Chaque jour', w: 'Chaque semaine' };
  var ICONS = {
    plan: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    tasks: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
    week: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    stats: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
    settings: '<path d="M5 7h14M5 17h14"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/>'
  };

  /* ---------- Utilitaires ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function p2(n) { return String(n).padStart(2, '0'); }
  function toMin(h) { var p = String(h).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function fmt(m) { m = Math.max(0, Math.round(m)); return p2(Math.floor(m / 60)) + ':' + p2(m % 60); }
  function dur(d) { d = Math.round(d); if (d < 60) return d + ' min'; var h = Math.floor(d / 60), r = d % 60; return r ? h + ' h ' + p2(r) : h + ' h'; }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function iso(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function parseISO(s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function diffDays(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 864e5); }
  function dow(s) { var d = parseISO(s).getDay(); return d === 0 ? 7 : d; }
  function weekStart(s) { return addDays(s, 1 - dow(s)); }
  function dayLabel(s, long) { try { return parseISO(s).toLocaleDateString('fr-FR', long ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short', day: 'numeric' }); } catch (e) { return s; } }
  function todayISO() { return iso(new Date()); }

  /* ---------- État ---------- */
  function defaults() { return { theme: 'auto', notif: { block: true, morning: true, review: true, focus: true } }; }
  function ensure(s) {
    s.v = 2;
    s.ctx = Object.assign({ start: '09:00', end: '18:00', energie: 'moyenne', peak: 'matin', goal: '', pause: 15, auto: true, review: '20:30' }, s.ctx || {});
    s.tasks = (s.tasks || []).map(function (t) { return Object.assign({ cat: '', rec: '', due: '', hold: '', postponed: 0, done: false, imp: 2, effort: 2, impact: false, deleg: false, dur: 30 }, t); });
    s.events = (s.events || []).map(function (e) { return Object.assign({ rep: 'daily', date: todayISO() }, e); });
    s.goals = s.goals || []; s.history = s.history || [];
    var d = defaults(), n = Object.assign({}, d.notif, (s.settings && s.settings.notif) || {});
    s.settings = Object.assign({}, d, s.settings || {}, { notif: n });
    s.nf = s.nf || { day: '', keys: {} };
    s.lastOpen = s.lastOpen || todayISO(); s.closed = s.closed || ''; s.focus = s.focus || null;
    return s;
  }
  function T(title, d, imp, due, impact, effort, deleg, post, cat, rec) {
    return { id: uid(), title: title, dur: d, imp: imp, due: due, impact: impact, effort: effort, deleg: deleg, postponed: post, cat: cat, rec: rec || '', hold: '', done: false };
  }
  function sample() {
    var td = todayISO(), hist = [], hrs = [[9, 3, 45, 'Clients'], [10, 2, 30, 'Clients'], [14, 1, 30, 'Admin'], [9, 3, 60, 'Production'], [11, 2, 30, 'Marketing'], [15, 1, 20, 'Admin']];
    for (var i = 1; i <= 6; i++) { for (var j = 0; j < 3; j++) { var r = hrs[(i + j * 2) % hrs.length]; hist.push({ d: addDays(td, -i), h: r[0], effort: r[1], dur: r[2], cat: r[3], title: 'Exemple' }); } }
    return ensure({
      sample: true, lastOpen: td,
      ctx: { start: '09:00', end: '12:00', energie: 'basse', peak: 'matin', goal: 'signer des clients', pause: 15, auto: true, review: '20:30' },
      tasks: [
        T('Relancer 5 prospects', 45, 3, td, true, 2, false, 0, 'Clients'),
        T('Préparer l’offre client', 45, 3, td, true, 3, false, 1, 'Clients'),
        T('Répondre aux 3 mails stratégiques', 30, 2, td, false, 1, false, 0, 'Clients'),
        T('Faire la compta du mois', 60, 2, addDays(td, 2), false, 1, false, 3, 'Admin'),
        T('Préparer le devis Dupont', 60, 3, addDays(td, 1), true, 3, false, 0, 'Clients'),
        T('Publier un post LinkedIn', 20, 1, '', false, 1, true, 0, 'Marketing', 'w'),
        T('Trier les mails non urgents', 40, 1, '', false, 1, false, 0, 'Admin')
      ],
      events: [{ id: uid(), label: 'Appel fournisseur', start: '11:30', end: '12:00', rep: 'weekdays', date: td }],
      goals: [
        { id: uid(), text: 'Signer 2 nouveaux clients', per: 'week', done: false },
        { id: uid(), text: 'Envoyer 10 devis', per: 'week', done: true },
        { id: uid(), text: 'Atteindre 8 000 € de chiffre d’affaires', per: 'month', done: false }
      ],
      history: hist
    });
  }
  function blank() { return ensure({ sample: false, tasks: [], events: [] }); }
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.ctx && Array.isArray(o.tasks)) return ensure(o); } } catch (e) {}
    return sample();
  }
  var S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var tab = 'plan', notice = null, armClose = false, closeTimer = null, formErr = '', editing = null, formOpen = false, filter = 'todo', deferred = null, swReg = null;
  var PC = null, PLAN = null;
  function blankDraft() { return { imp: 2, effort: 2, impact: false, deleg: false }; }
  var draft = blankDraft();

  function applyTheme() {
    try { var r = document.documentElement, t = S.settings.theme; if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme'); } catch (e) {}
  }

  /* ---------- Moteur de priorisation et de planification ---------- */
  function planCtx() {
    var d = new Date(), today = iso(d), nowM = d.getHours() * 60 + d.getMinutes();
    var start = toMin(S.ctx.start), end = toMin(S.ctx.end), pd = today, tomorrow = false;
    if (S.ctx.auto) {
      if (nowM >= end - 15) { pd = addDays(today, 1); tomorrow = true; }
      else if (nowM > start) start = Math.min(Math.ceil(nowM / 5) * 5, end - 15);
    }
    return { pd: pd, start: start, end: end, tomorrow: tomorrow, today: today, nowM: nowM };
  }
  function eventsFor(pd) {
    var w = dow(pd);
    return S.events.filter(function (e) {
      var r = e.rep || 'daily';
      if (r === 'once') return e.date === pd;
      if (r === 'weekdays') return w <= 5;
      if (r === 'weekly') return e.date && dow(e.date) === w;
      return true;
    });
  }
  function urgency(t, pd) { if (!t.due) return 0; var d = diffDays(pd, t.due); return d <= 0 ? 2 : (d <= 3 ? 1 : 0); }
  function goalMatch(t, goal) {
    var words = norm(goal).split(/[^a-z0-9]+/).filter(function (w) { return w.length > 3; });
    if (!words.length) return false;
    var title = norm(t.title);
    return words.some(function (w) { return title.indexOf(w.slice(0, Math.max(4, w.length - 2))) >= 0; });
  }
  function score(t, ctx, pd) {
    var s = t.imp * 3 + urgency(t, pd) * 3 + (t.impact ? 3 : 0) + Math.min(t.postponed, 5);
    if (t.due && diffDays(pd, t.due) < 0) s += 2;
    if (goalMatch(t, ctx.goal)) s += 3;
    if (ctx.energie === 'basse' && t.effort === 3) s -= 2;
    if (ctx.energie === 'haute' && t.effort === 3) s += 1;
    return s;
  }
  function dueText(t, pd) {
    if (!t.due) return '';
    var d = diffDays(pd, t.due);
    if (d < 0) return 'En retard de ' + (-d) + ' j';
    if (d === 0) return pd === todayISO() ? 'À traiter aujourd’hui' : 'À rendre demain';
    if (d === 1) return 'Échéance demain';
    return 'Échéance ' + dayLabel(t.due);
  }
  function whyTask(o, ctx, pd, inPeak) {
    var t = o.t, r = [];
    if (goalMatch(t, ctx.goal)) r.push('Sert ta priorité du jour (' + ctx.goal.trim() + ').');
    if (t.impact) r.push('Impact direct sur ton activité.');
    if (t.due && diffDays(pd, t.due) <= 0) r.push(dueText(t, pd) + '.');
    if (t.postponed >= 2) r.push('Déjà reportée ' + t.postponed + ' fois.');
    if (t.effort === 3 && inPeak) r.push('Tâche exigeante, placée dans ton meilleur créneau.');
    if (t.effort === 1 && ctx.energie === 'basse') r.push('Légère, compatible avec ton énergie du moment.');
    if (!r.length) r.push('Elle tient dans le temps restant et allège ta liste.');
    return r.slice(0, 2).join(' ');
  }
  function buildPlan(s, pc) {
    var ctx = s.ctx, start = pc.start, end = pc.end, pd = pc.pd;
    var out = { blocks: [], later: [], work: 0, free: Math.max(0, end - start), ids: {} };
    if (end - start < 15) return out;
    var events = eventsFor(pd).map(function (e) { return { id: e.id, label: e.label, a: toMin(e.start), b: toMin(e.end) }; })
      .filter(function (e) { return e.b > start && e.a < end && e.b > e.a; }).sort(function (x, y) { return x.a - y.a; });
    var evMin = 0; events.forEach(function (e) { evMin += Math.min(e.b, end) - Math.max(e.a, start); });
    out.free = Math.max(0, end - start - evMin);
    var pool = [], deleg = [];
    s.tasks.filter(function (t) { return !t.done && !(t.hold && t.hold > pd); }).forEach(function (t) {
      var o = { t: t, score: score(t, ctx, pd) };
      if (t.deleg && t.imp <= 2 && urgency(t, pd) < 2) deleg.push(o); else pool.push(o);
    });
    pool.sort(function (a, b) { return b.score - a.score; });
    var used = {}, cur = start, run = 0, guard = 0, pk = PEAK[ctx.peak] || PEAK.matin, pause = +ctx.pause || 0;

    if (secondary && skippedTop) m.push({ tone: 'warn', text: 'Tu dépenses de l’énergie sur « ' + secondary.o.t.title + ' » alors que « ' + skippedTop.o.t.title + ' » reste en attente.' });

    if (a === 'done') { markDone(id); notice = null; save(); render(); return; }
    if (a === 'undo') { undoDone(id); notice = null; save(); render(); return; }
    if (a === 'push') { t = S.tasks.filter(function (x) { return x.id === id; })[0]; if (t && t.due) { t.due = addDays(t.due < PC.pd ? PC.pd : t.due, 1); save(); render(); } return; }
    if (a === 'focus') {
      t = S.tasks.filter(function (x) { return x.id === id; })[0]; if (!t) return;
      S.focus = { id: id, end: Date.now() + t.dur * 60000, alerted: false }; save(); render(); return;
    }
    if (a === 'fdone') { markDone(id); S.focus = null; save(); render(); return; }
    if (a === 'fstop') { S.focus = null; save(); render(); return; }
    if (a === 'now') {
      var d = new Date(), nowM = Math.ceil((d.getHours() * 60 + d.getMinutes()) / 5) * 5;
      if (nowM > toMin(S.ctx.start) && nowM < toMin(S.ctx.end) - 15) {
        before = ids(); S.ctx.start = fmt(nowM); save();
        out = pushedOut(before);
        notice = { warn: out.length > 0, text: 'Plan recalculé à partir de ' + S.ctx.start + '.' + (out.length ? ' Je repousse : ' + out.join(', ') + '.' : '') };
      } else notice = { warn: false, text: 'Il est ' + fmt(d.getHours() * 60 + d.getMinutes()) + ' : en dehors de ta plage ou trop proche de la fin. Ajuste-la dans Réglages.' };
      render(); return;
    }
    if (a === 'urgent') {
      var title = (document.getElementById('u-title').value || '').trim();
      if (!title) { notice = { warn: true, text: 'Décris l’urgence pour que je la place.' }; render(); return; }
      before = ids();
      addTask({ title: title, dur: +document.getElementById('u-dur').value || 30, imp: 3, effort: 2, due: PC.pd }); save();
      out = pushedOut(before);
      notice = { warn: out.length > 0, text: '« ' + title + ' » passe en premier.' + (out.length ? ' Je repousse : ' + out.join(', ') + '.' : ' Le reste tient encore.') };
      render({ 'u-title': '' }); window.scrollTo(0, 0); return;
    }
    if (a === 'close') {
      if (!armClose) { armClose = true; clearTimeout(closeTimer); closeTimer = setTimeout(function () { armClose = false; render(); }, 4000); render(); return; }
      var r = closeDay(todayISO()); armClose = false; save();
      notice = { warn: false, text: 'Journée clôturée : ' + r.done + ' tâche' + (r.done > 1 ? 's' : '') + ' terminée' + (r.done > 1 ? 's' : '') + ', ' + r.rest + ' reportée' + (r.rest > 1 ? 's' : '') + '.' };
      render(); return;
    }
    if (a === 'addev') {
      var lab = (document.getElementById('e-label').value || '').trim(), es = document.getElementById('e-start').value, ee = document.getElementById('e-end').value;
      var rep = document.getElementById('e-rep').value, dt = document.getElementById('e-date').value || todayISO();
      if (!lab || !es || !ee || toMin(ee) <= toMin(es)) { formErr = 'Indique un intitulé et une fin postérieure au début.'; render(); return; }
      formErr = ''; S.events.push({ id: uid(), label: lab, start: es, end: ee, rep: rep, date: dt }); S.sample = false; save(); render({ 'e-label': '' }); return;
    }
    if (a === 'delev') { S.events = S.events.filter(function (x) { return x.id !== id; }); save(); render(); return; }
    if (a === 'gadd') {
      var gt = (document.getElementById('g-text').value || '').trim(); if (!gt) return;
      S.goals.push({ id: uid(), text: gt, per: document.getElementById('g-per').value, done: false }); S.sample = false; save(); render({ 'g-text': '' }); return;
    }
    if (a === 'gtog') { var g = S.goals.filter(function (x) { return x.id === id; })[0]; if (g) { g.done = !g.done; save(); render(); } return; }
    if (a === 'gdel') { S.goals = S.goals.filter(function (x) { return x.id !== id; }); save(); render(); return; }
    if (a === 'ics') {
      var ok = download('cadence-' + PC.pd + '.ics', buildICS(), 'text/calendar');
      notice = { warn: !ok, text: ok ? 'Fichier agenda prêt. Ouvre-le pour ajouter chaque bloc à ton calendrier avec un rappel 5 minutes avant.' : 'Le téléchargement est bloqué ici. Ouvre l’appli installée pour l’utiliser.' };
      render(); return;
    }
    if (a === 'export') { download('cadence-sauvegarde-' + todayISO() + '.json', JSON.stringify(S, null, 1), 'application/json'); return; }
    if (a === 'notifperm') {
      try { Notification.requestPermission().then(function () { render(); }); } catch (err) { render(); }
      return;
    }
    if (a === 'notiftest') { var okn = notify('Cadence', 'Les notifications fonctionnent.', 'test'); notice = { warn: !okn, text: okn ? 'Notification envoyée.' : 'Impossible d’envoyer la notification sur cet appareil.' }; render(); return; }
    if (a === 'install') { if (deferred) { deferred.prompt(); deferred = null; render(); } return; }
    if (a === 'sample') { S = sample(); notice = null; editing = null; save(); applyTheme(); tab = 'plan'; render(); window.scrollTo(0, 0); return; }
    if (a === 'blank') { S = blank(); notice = null; editing = null; save(); applyTheme(); tab = 'tasks'; filter = 'todo'; formOpen = true; render(resetForm()); window.scrollTo(0, 0); return; }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'imp-file') {
      var file = el.files && el.files[0]; if (!file) return;
      var fr = new FileReader();
      fr.onload = function () {
        try { var o = JSON.parse(fr.result); if (!o || !Array.isArray(o.tasks) || !o.ctx) throw new Error('x'); S = ensure(o); S.sample = false; save(); applyTheme(); formErr = ''; notice = { warn: false, text: 'Sauvegarde importée.' }; tab = 'plan'; }
        catch (err) { formErr = 'Import impossible : fichier non reconnu.'; }
        render();
      };
      fr.readAsText(file); return;
    }
    var k = el.dataset && el.dataset.ctx; if (!k) return;
    var val = el.value, next = Object.assign({}, S.ctx); next[k] = val;
    if ((k === 'start' || k === 'end') && (!val || toMin(next.end) - toMin(next.start) < 30)) { notice = { warn: true, text: 'La fin doit être au moins 30 minutes après le début.' }; render(); return; }
    S.ctx[k] = k === 'pause' ? +val : val; save(); render();
  });

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; if (tab === 'settings') render(); });
  window.addEventListener('appinstalled', function () { deferred = null; if (tab === 'settings') render(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(); } });

  try { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(function (r) { swReg = r; }).catch(function () {});
    navigator.serviceWorker.ready.then(function (r) { swReg = r; }).catch(function () {});
  } } catch (e) {}

  applyTheme();
  rollover();
  try { if (/[?&]add=1/.test(location.search)) { tab = 'plan'; } } catch (e) {}
  render();
  try { if (/[?&]add=1/.test(location.search)) { var qa = document.getElementById('q-add'); if (qa) qa.focus(); } } catch (e) {}
  var sec = 0;
  setInterval(function () { updateFocus(); sec++; if (sec % 30 === 0) tick(); }, 1000);
  setTimeout(tick, 1500);
  
})();
</script>
</body>
</html>
