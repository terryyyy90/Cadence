<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5B4BFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">

<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Cadence v14 : agenda simple. Une colonne de 720 px max, listes groupées, navigation fixe à 4 onglets. */
:root {
  --bg: #F2F3F8; --surface: #FFFFFF; --soft: #E9EBF4; --ink: #14162B; --muted: #626882; --line: #E0E3EE;
  --acc-l: #5B4BFF; --acc-d: #8F86FF;
  --accent: var(--acc-l); --on-accent: #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
  --ok: #0C9A60; --ok-soft: #DCF4E8; --bad: #D92D4B; --warn: #B45309;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --font-clock: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F1C; --surface: #171A2C; --soft: #23263C; --ink: #ECEEFA; --muted: #9DA2BD; --line: #2A2E47;
    --accent: var(--acc-d); --on-accent: #0D0F1C; --ok: #3DD598; --ok-soft: #173528; --bad: #FF8A9B; --warn: #F0B45A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F1C; --surface: #171A2C; --soft: #23263C; --ink: #ECEEFA; --muted: #9DA2BD; --line: #2A2E47;
  --accent: var(--acc-d); --on-accent: #0D0F1C; --ok: #3DD598; --ok-soft: #173528; --bad: #FF8A9B; --warn: #F0B45A; color-scheme: dark;
}
* { box-sizing: border-box; }
*::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px));
}
body.noscroll { overflow: hidden; }
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.03em; line-height: 1.05; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1.15; }
h3 { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; line-height: 1.25; }
.sub { color: var(--muted); }
.hint { color: var(--muted); font-size: 13.5px; }
.err { color: var(--bad); font-size: 14px; }
.tnum { font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="email"], input[type="password"], input[type="time"], input[type="date"], input[type="search"], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 48px; padding: 0 14px; width: 100%; min-width: 0;
}
textarea { padding: 12px 14px; min-height: 90px; resize: vertical; }
label.f { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

/* boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--soft); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: none; color: var(--accent); padding: 0 8px; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); color: #fff; }
.btn.big { width: 100%; min-height: 54px; font-size: 16.5px; border-radius: 16px; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .55; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.icb { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; color: var(--ink); }
.icb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* en-tête */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 4px; }
.top .date { color: var(--muted); font-size: 14.5px; margin-bottom: 4px; }
.top .date::first-letter { text-transform: uppercase; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 16px; flex: none; border: 0; cursor: pointer; }
.avatar.big { width: 72px; height: 72px; font-size: 26px; cursor: default; }

/* sélecteur de vue */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--soft); border-radius: 16px; padding: 4px; }
.seg button { min-height: 42px; border: 0; border-radius: 12px; background: none; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 22, 43, .12); }

/* navigation de période */
.pnav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 10px; }
.pnav .pl { text-align: center; min-width: 0; }
.pnav .pl h2 { font-size: 22px; }
.pnav .pl h2::first-letter { text-transform: uppercase; }
.pnav .pl small { display: block; color: var(--muted); font-size: 13.5px; }
.today-btn { justify-self: center; }

/* listes groupées */
.blk { display: grid; gap: 10px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sh .cnt { color: var(--muted); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .txt { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 0; cursor: pointer; display: grid; gap: 1px; overflow-wrap: anywhere; }
.row .txt span { font-size: 16px; }
.row .txt small { color: var(--muted); font-size: 13px; }
.row .tm { font-size: 14px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; flex: none; min-width: 44px; }
.row.done .txt span { text-decoration: line-through; color: var(--muted); }
.row .x { width: 40px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 22px; border-radius: 10px; cursor: pointer; flex: none; }
.empty { padding: 14px; color: var(--muted); font-size: 14.5px; }
.ck { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; color: transparent; }
.ck svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ck[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.add { display: flex; gap: 8px; align-items: center; padding: 8px; border-top: 1px solid var(--line); }
.list .add:first-child { border-top: 0; }
.add input[type="text"] { border: 0; background: none; min-height: 42px; padding: 0 6px; }
.add input[type="time"] { width: 104px; flex: none; min-height: 40px; padding: 0 8px; font-size: 14px; border-radius: 12px; background: var(--soft); border: 0; }
.add .btn { flex: none; }
.addplus { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 24px; line-height: 1; cursor: pointer; flex: none; }
.bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* semaine */
.wk { display: grid; gap: 10px; }
.wday { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: start; }
.wnum { display: grid; justify-items: center; gap: 0; padding-top: 6px; border: 0; background: none; cursor: pointer; color: var(--ink); }
.wnum b { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.wnum span { font-size: 13px; color: var(--muted); font-weight: 600; }
.wday.today .wnum b, .wday.today .wnum span { color: var(--accent); }
.wday .list { min-height: 54px; }
.wday.today .list { border-color: var(--accent); }
.addline { width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font-weight: 600; font-size: 14.5px; min-height: 44px; padding: 0 14px; cursor: pointer; }
.list .addline:first-child { border-top: 0; }

/* mois */
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mgrid .dl { text-align: center; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.mc { aspect-ratio: 1 / 1.05; min-height: 44px; border-radius: 12px; border: 1px solid transparent; background: var(--surface); display: grid; grid-template-rows: auto 1fr; justify-items: center; padding: 5px 2px 4px; cursor: pointer; color: var(--ink); }
.mc.out { background: none; color: var(--muted); opacity: .45; }
.mc b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mc .dots { display: flex; gap: 3px; align-self: end; height: 6px; }
.mc .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.mc .dots i.d { background: var(--line); }
.mc.today b { color: var(--accent); font-weight: 800; }
.mc.today { border-color: var(--accent); }
.mc[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.mc[aria-pressed="true"] b { color: var(--on-accent); }
.mc[aria-pressed="true"] .dots i { background: var(--on-accent); }
.mc[aria-pressed="true"] .dots i.d { opacity: .5; }

/* année */
.yr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.yt { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px; display: grid; gap: 6px; text-align: left; cursor: pointer; min-width: 0; }
.yt b { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.yt b::first-letter { text-transform: uppercase; }
.yt small { color: var(--muted); font-size: 12.5px; }
.yt.now { border-color: var(--accent); }
.yt.now b { color: var(--accent); }

/* objectifs */
.gsec .sh h3 small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13.5px; color: var(--muted); letter-spacing: 0; }

/* pomodoro */
.tmr { border-radius: 22px; border: 1px solid var(--line); background: var(--surface); padding: 16px; display: grid; gap: 12px; }
.tmr.run { background: var(--acc-l); border-color: var(--acc-l); color: #fff; }
.tmr.brk { background: #0C8A57; border-color: #0C8A57; color: #fff; }
.tmr .th { display: flex; align-items: center; gap: 10px; }
.tmr .th input { flex: 1; font-family: var(--font-display); font-weight: 700; font-size: 18px; border: 0; background: none; padding: 0 2px; min-height: 36px; color: inherit; }
.tmr .ph { font-size: 13.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); flex: none; }
.tmr.run .ph, .tmr.brk .ph { background: rgba(255, 255, 255, .2); color: #fff; }
.clock { font-family: var(--font-clock); font-variant-numeric: tabular-nums; font-size: 56px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; text-align: center; padding: 6px 0 2px; }
.tmr .bar { background: var(--soft); }
.tmr.run .bar, .tmr.brk .bar { background: rgba(255, 255, 255, .25); }
.tmr.run .bar i, .tmr.brk .bar i { background: #fff; }
.tmr .btns { justify-content: center; }
.tmr.run .btn, .tmr.brk .btn { background: rgba(255, 255, 255, .18); color: #fff; }
.tmr.run .btn.primary, .tmr.brk .btn.primary { background: #fff; color: #2B1FB8; }
.tmr.brk .btn.primary { color: #0B6B44; }
.tset { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stp { display: flex; align-items: center; justify-content: space-between; gap: 4px; background: var(--soft); border-radius: 14px; padding: 4px; }
.tmr.run .stp, .tmr.brk .stp { background: rgba(255, 255, 255, .14); }
.stp span { font-size: 13.5px; font-weight: 600; text-align: center; line-height: 1.2; }
.stp span small { display: block; font-weight: 500; opacity: .75; font-size: 12px; }
.stp button { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface); color: inherit; font-size: 20px; cursor: pointer; flex: none; }
.tmr.run .stp button, .tmr.brk .stp button { background: rgba(255, 255, 255, .2); }
.tmr .tf { text-align: center; font-size: 13.5px; opacity: .85; }

/* profil */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.me { display: flex; align-items: center; gap: 14px; }
.sw { display: flex; gap: 10px; flex-wrap: wrap; }
.sw button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.tg { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
.switch { width: 52px; height: 30px; border-radius: 15px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.switch[aria-pressed="true"] { background: var(--accent); }
.switch[aria-pressed="true"]::after { left: 25px; }
.ver { text-align: center; color: var(--muted); font-size: 13px; }

/* accueil */
.ob { display: grid; gap: 18px; padding-top: 8px; }
.ob .lead { font-size: 16.5px; color: var(--muted); }
.ob h1 { font-size: 36px; }
.steps { display: flex; gap: 6px; }
.steps i { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--accent); }

/* feuille, toast, nav */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(13, 15, 28, .45); border: 0; padding: 0; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 720px; margin: 0 auto; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; box-shadow: 0 -10px 40px rgba(13, 15, 28, .3); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet form { display: grid; gap: 14px; }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 28px), 560px); background: #14162B; color: #fff; border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 8px; font-size: 14.5px; box-shadow: 0 12px 30px rgba(13, 15, 28, .35); }
.toast span { flex: 1; min-width: 0; }
.toast button { border: 0; background: rgba(255, 255, 255, .16); color: #fff; font-weight: 700; font-size: 14px; min-height: 38px; padding: 0 14px; border-radius: 10px; cursor: pointer; flex: none; }
.note { background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14.5px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 3px; min-height: 56px; padding: 6px 0 4px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; position: relative; isolation: isolate; }
.nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 58px; height: 32px; border-radius: 16px; background: var(--accent-soft); z-index: -1; }
.nav .run-dot { position: absolute; top: 6px; right: calc(50% - 22px); width: 9px; height: 9px; border-radius: 50%; background: #F0512D; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: up .22s ease-out; }
  @keyframes up { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }
  .ck:active, .btn:active, .mc:active { transform: scale(.96); }
}
@media (min-width: 560px) { .yr { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* ===== v15 ===== */
:root { --on-accent: var(--on-acc-l, #FFFFFF); }
:root[data-size="l"] body { zoom: 1.1; }
:root[data-size="xl"] body { zoom: 1.22; }
.tmr.run { color: var(--on-acc-l, #fff); }
body.gate { padding-bottom: 40px; }
.auth { display: grid; gap: 18px; padding-top: 10px; }
.auth h1 { font-size: 34px; }
.auth .lead { font-size: 16.5px; color: var(--muted); }
.auth.loading { min-height: 60vh; align-content: center; justify-items: center; text-align: center; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--acc-l); color: var(--on-acc-l, #fff); display: grid; place-items: center; }
.logo svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pw { display: flex; gap: 8px; align-items: center; }
.pw input { flex: 1; }
.eye { border: 0; background: var(--soft); color: var(--ink); border-radius: 12px; min-height: 48px; padding: 0 12px; font-weight: 600; font-size: 14px; cursor: pointer; flex: none; }
.chkline { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.4; color: var(--ink); cursor: pointer; }
.chkline input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.lnk { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; cursor: pointer; font-size: inherit; }
.okmsg { color: var(--ok); font-size: 14.5px; font-weight: 600; }
.legal-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; }
.legal-links button { border: 0; background: none; color: var(--muted); font-size: 13.5px; text-decoration: underline; cursor: pointer; padding: 6px 0; }
.links { display: grid; }
.links button, .links a { border: 0; border-top: 1px solid var(--line); background: none; text-align: left; padding: 14px 2px; font-size: 15.5px; color: var(--ink); cursor: pointer; text-decoration: none; font-weight: 500; }
.links > :first-child { border-top: 0; }
.motto { color: var(--muted); font-size: 15px; margin-top: 6px; }
.avatar { overflow: hidden; padding: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.cc { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; position: relative; overflow: hidden; display: grid; place-items: center; }
.cc::after { content: "+"; color: #fff; font-weight: 800; font-size: 18px; text-shadow: 0 1px 2px rgba(0, 0, 0, .4); pointer-events: none; }
.cc.on { box-shadow: 0 0 0 2px var(--ink); }
.cc input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.hid { padding: 10px 14px; color: var(--muted); font-size: 13.5px; border-top: 1px solid var(--line); }
.list .hid:first-child { border-top: 0; }
.pill { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
.prem .btn { justify-self: start; }
.danger-zone summary { cursor: pointer; color: var(--bad); font-weight: 600; font-size: 14.5px; padding: 6px 0; }
.danger-zone[open] { display: grid; gap: 10px; }
.danger-zone .btn { justify-self: start; }
.sheet.legal { gap: 12px; }
.doc { display: grid; gap: 10px; font-size: 15px; line-height: 1.55; }
.doc h3 { font-size: 16.5px; margin-top: 6px; }
.doc ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.doc a { color: var(--accent); }
.badge { justify-self: start; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.plan { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 2px; }
.plan b { font-family: var(--font-display); font-size: 24px; font-weight: 800; }
.plan span { color: var(--muted); font-size: 13.5px; }
.plan.best { border-color: var(--accent); }
.grid { display: grid; gap: 12px; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function itemsOn(day) {
    return S.items.map(function (x, i) { return { x: x, i: i }; }).filter(function (o) { return o.x.d === day; }).sort(function (a, b) {
      var ta = a.x.time || '99:99', tb = b.x.time || '99:99';

  function pkey(per, d) { return per === 'd' ? d : per === 'w' ? weekStart(d) : per === 'm' ? d.slice(0, 7) : d.slice(0, 4); }

  var PER_T = { d: 'Objectifs du jour', w: 'Objectifs de la semaine', m: 'Objectifs du mois', y: 'Objectifs de l’année' };
  function perSub(per, d) {
    if (per === 'd') return cap1(dayLong(d));

  }

  function initials() { var p = S.profile; return ((p.first || '').charAt(0) + (p.last || '').charAt(0)).toUpperCase() || '?'; }
  function showToast(text, undo) { toast = { text: text, undo: undo || null }; clearTimeout(toastT); toastT = setTimeout(function () { toast = null; var el = document.getElementById('toast'); if (el) el.remove(); }, 6000); }
  function arm(key) { if (armKey === key) { armKey = ''; clearTimeout(armT); return true; } armKey = key; clearTimeout(armT); armT = setTimeout(function () { armKey = ''; render(); }, 4000); render(); return false; }
  function editing() { var a = document.activeElement; return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')); }

  /* ---------- Agenda ---------- */

    var label = '', small = '', isNow = false, t = todayISO();
    if (view === 'd') { label = dayLong(cur); small = relDay(cur); isNow = cur === t; }

    else if (view === 'm') { var m = parseISO(cur); label = MOIS[m.getMonth()] + ' ' + m.getFullYear(); isNow = cur.slice(0, 7) === t.slice(0, 7); }

  }
  function viewDay() {
    var its = itemsOn(cur);

  /* ---------- Objectifs ---------- */

    var t = todayISO();

    var m = String((er && er.message) || ''), c = String((er && er.code) || '');
    if (er && er.net) return 'Pas de connexion internet.';
    if (/invalid login|invalid_credentials/i.test(m + c)) return 'E-mail ou mot de passe incorrect.';
    if (/already registered|user_already_exists|already been registered/i.test(m + c)) return 'Un compte existe déjà avec cet e-mail. Appuie sur « Se connecter ».';
    if (/weak_password|at least 6|password should/i.test(m + c)) return 'Mot de passe trop court : 6 caractères minimum.';
    if (/rate|too many/i.test(m + c) || (er && er.status === 429)) return 'Trop de tentatives. Réessaie dans quelques minutes.';
    if (/validate_email|email.*invalid|invalid.*email|unable to validate/i.test(m + c)) return 'Adresse e-mail non valide.';
    if (/signup.*disabled|signups not allowed/i.test(m + c)) return 'Les inscriptions sont désactivées.';
    if (/not.*confirmed/i.test(m + c)) return 'Confirme d’abord ton e-mail.';
    if (/api key|apikey/i.test(m)) return 'Clé du serveur refusée : réglage de l’appli à corriger.';
    return 'Erreur : ' + m;
  }

  function pullRow() {
    return authed('GET', '/rest/v1/cadence_state?select=data,updated_at').then(function (r) { return (Array.isArray(r) && r[0]) || null; });
  }
  function validData(d) { return !!(d && d.app === 'agenda'); }
  function applyRemote(row) {
    lsSet('cadence.agenda.backup', JSON.stringify(S));
    var n = ensure(JSON.parse(JSON.stringify(row.data)));
    n.timers = n.timers.map(function (t) { var l = S.timers.filter(function (z) { return z.id === t.id; })[0]; return l ? Object.assign({}, l, { name: t.name, work: t.work, brk: t.brk }) : t; });
    S = n;
    lsSet(CR, row.updated_at); lsSet(CD, null);
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    if (auth) S.owner = auth.uid;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    lastSer = ser(); applyTheme(); sheet = null; view = (['d', 'w', 'm', 'y'].indexOf(S.settings.defView) >= 0 ? S.settings.defView : 'd');
  }
  function cloudSync() {
    if (!auth || !cloudOn || syncing) return Promise.resolve();
    syncing = true; lastPull = Date.now(); setSt('sync');
    return pullRow().then(function (row) {
      var L = lsGet(CR) || '', dirty = lsGet(CD) === '1';
      var pr = preferRemote, pl = preferLocal; preferRemote = false; preferLocal = false;
      if (pl && row) { syncing = false; booting = false; return cloudPush(); }
      if (!row || !validData(row.data)) { syncing = false; booting = false; return cloudPush(); }
      if (L && row.updated_at === L) { syncing = false; booting = false; if (dirty) return cloudPush(); setSt('ok'); return; }
      var isFresh = !S.profile.done && !S.items.length && !S.goals.length;
      if (isFresh || pr || (L && !dirty)) { applyRemote(row); syncing = false; booting = false; setSt('ok'); if (!editing()) render(); return; }
      syncing = false; booting = false; sync.conflict = row; setSt('conflict');
    }).catch(function (er) { syncing = false; booting = false; if (auth) setSt('err', frErr(er)); else render(); });
  }
  function cloudPush() {
    if (!auth || !cloudOn || sync.conflict) return Promise.resolve();
    if (pushing) { again = true; return Promise.resolve(); }
    pushing = true; setSt('sync');
    var c0 = chg, sent = ser(), body = { user_id: auth.uid, data: JSON.parse(sent), updated_at: new Date().toISOString() };
    return authed('POST', '/rest/v1/cadence_state?on_conflict=user_id', body, { Prefer: 'resolution=merge-duplicates,return=representation' }).then(function (r) {
      var row = Array.isArray(r) ? r[0] : r;
      if (row && row.updated_at) return row.updated_at;
      return pullRow().then(function (x) { return x && x.updated_at; });
    }).then(function (ua) {
      pushing = false;
      if (ua) lsSet(CR, ua);
      if (chg === c0) lsSet(CD, null); else again = true;
      setSt('ok');
      if (again) { again = false; clearTimeout(pushT); pushT = setTimeout(cloudPush, 1500); }
    }).catch(function (er) { pushing = false; again = false; if (auth) setSt('err', frErr(er)); });
  }
  function wipeLocal() {
    var th = S.settings.theme, sz = S.settings.size; S = fresh(); S.settings.theme = th; S.settings.size = sz;
    try { localStorage.removeItem(KEY); } catch (e) {}
    lsSet(CD, null); lsSet(CR, null); applyTheme(); tab = 'agenda'; view = 'd'; cur = todayISO(); sel = cur; sheet = null; obStep = 0;
  }
  function afterLogin(isNew) {
    var uid = auth.uid;
    if (S.owner && S.owner !== uid) wipeLocal();
    else if (S.owner === uid && lsGet(CD) !== '1') preferRemote = true;
    else if (S.owner === uid) preferLocal = true;
    S.owner = uid;
    if (isNew) S.consent = { version: LEGAL_DATE, at: new Date().toISOString() };
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    lsSet(CR, null); lastSer = ser(); if (isNew) { lsSet(CD, '1'); chg++; }
    if (!S.profile.done) booting = true;
    sync = { st: 'sync', at: '', err: '', conflict: null }; acct.err = ''; acct.info = ''; peek = false; render();
    return cloudSync();
  }
  function cloudSignOutLocal(msg, keepDirty) {
    auth = null; lsSet(CK, null); lsSet(CR, null); if (!keepDirty) lsSet(CD, null); lsSet(CM, null); lsSet(CT, null);
    sync = { st: 'idle', at: '', err: '', conflict: null }; acct.info = msg || ''; acct.err = ''; acct.busy = false; clearTimeout(pushT); booting = false;
    if (!keepDirty) authMode = 'in';
    render();
  }
  function cloudLogout() {
    acct.busy = true; render();
    var p = (lsGet(CD) === '1' && !sync.conflict) ? cloudPush() : Promise.resolve();
    p.catch(function () {}).then(function () { return authed('POST', '/auth/v1/logout').catch(function () {}); }).then(function () {
      wipeLocal(); cloudSignOutLocal('Tu es déconnecté. Ton agenda est sauvegardé dans ton compte.');
    });
  }
  function cloudDelete() {
    acct.busy = true; acct.err = ''; render();
    authed('POST', '/rest/v1/rpc/delete_my_account', {}).then(function () {
      wipeLocal(); cloudSignOutLocal('Ton compte et toutes tes données ont été supprimés.'); authMode = 'up'; render();
    }).catch(function (er) {
      acct.busy = false;
      acct.err = (er.status === 404 || /PGRST202|could not find the function/i.test((er.message || '') + (er.code || ''))) ? 'La suppression automatique n’est pas encore activée. Écris à ' + CONTACT + ' pour demander la suppression de ton compte.' : frErr(er);
      render();
    });
  }
  function cloudAuth(kind) {
    var em = (document.getElementById('a-mail') || {}).value || '', pw = (document.getElementById('a-pass') || {}).value || '';
    em = em.trim(); kind = kind === 'in' ? 'in' : 'up';
    acct.info = '';
    if (!/^\S+@\S+\.\S+$/.test(em)) { acct.err = 'Écris une adresse e-mail valide.'; render(); return; }
    if (kind === 'up' && pw.length < 8) { acct.err = 'Choisis un mot de passe d’au moins 8 caractères.'; render(); return; }
    if (kind === 'in' && pw.length < 6) { acct.err = 'Mot de passe trop court.'; render(); return; }
    if (kind === 'up' && !((document.getElementById('a-cgu') || {}).checked)) { acct.err = 'Coche la case pour accepter les conditions d’utilisation.'; render(); return; }
    acct.busy = true; acct.err = ''; render();
    raw('POST', kind === 'up' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password', { email: em, password: pw }).then(function (j) {
      acct.busy = false;
      if (!j || !j.access_token) { acct.info = 'Compte créé, mais il faut confirmer ton e-mail avant de te connecter : ouvre le message reçu, puis reviens ici.'; render(); return; }
      setAuth(j, em);
      var pa = document.getElementById('a-pass'); if (pa) pa.value = '';
      return afterLogin(kind === 'up');
    }).catch(function (er) { acct.busy = false; acct.err = frErr(er); render(); });
  }
  function cloudForgot() {
    var em = ((document.getElementById('a-mail') || {}).value || '').trim();
    acct.info = '';
    if (!/^\S+@\S+\.\S+$/.test(em)) { acct.err = 'Écris d’abord ton e-mail, puis appuie sur « Mot de passe oublié ».'; render(); return; }
    acct.busy = true; acct.err = ''; render();
    var back = location.origin + location.pathname;
    raw('POST', '/auth/v1/recover?redirect_to=' + encodeURIComponent(back), { email: em }).then(function () {
      acct.busy = false; acct.info = 'Si un compte existe pour cet e-mail, un message vient d’être envoyé. Ouvre le lien qu’il contient (vérifie aussi les courriers indésirables).'; render();
    }).catch(function (er) { acct.busy = false; acct.err = frErr(er); render(); });
  }
  function recoveryInit() {
    var h = ''; try { h = location.hash || ''; } catch (e) {}
    if (!/[#&](access_token|error)=/.test(h)) return;
    var q = {}; h.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); });
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (q.error) { acct.err = /expired|invalid/i.test((q.error_code || '') + (q.error_description || '')) ? 'Ce lien a expiré ou a déjà servi. Refais « Mot de passe oublié ».' : 'Le lien n’a pas fonctionné : ' + (q.error_description || q.error); authMode = 'in'; return; }
    if (q.type === 'recovery' && q.access_token) recov = { at: q.access_token, rt: q.refresh_token || '', ei: +q.expires_in || 3600, err: '', busy: false };
  }
  function recoverySheet() {
    if (!recov) return '';
    return '<button class="scrim" data-act="rcclose" aria-label="Fermer"></button><section class="sheet" role="dialog" aria-label="Nouveau mot de passe"><div class="grab"></div><h2>Nouveau mot de passe</h2>' +
      '<form id="rcform" autocomplete="off"><label class="f" for="rc-pass">Choisis un nouveau mot de passe (6 caractères minimum)<input type="password" id="rc-pass" data-keep autocomplete="new-password"></label>' +
      (recov.err ? '<p class="err" role="alert">' + esc(recov.err) + '</p>' : '') + '<button type="submit" class="btn primary big"' + (recov.busy ? ' disabled' : '') + '>Enregistrer</button></form></section>';
  }
  function cloudRecover() {
    var pw = (document.getElementById('rc-pass') || {}).value || '';
    if (!recov) return;
    if (pw.length < 6) { recov.err = 'Le mot de passe doit faire au moins 6 caractères.'; render(); return; }
    recov.busy = true; recov.err = ''; render();
    raw('PUT', '/auth/v1/user', { password: pw }, { Authorization: 'Bearer ' + recov.at }).then(function (u) {
      var rc = recov; recov = null;
      setAuth({ access_token: rc.at, refresh_token: rc.rt, expires_in: rc.ei, user: u }, (u && u.email) || '');
      showToast('Mot de passe changé. Tu es connecté.');
      return afterLogin(false);
    }).catch(function (er) { if (recov) { recov.busy = false; recov.err = /same|different/i.test(er.message || '') ? 'Choisis un mot de passe différent de l’ancien.' : /expired|invalid|jwt/i.test(er.message || '') ? 'Le lien a expiré. Refais « Mot de passe oublié ».' : frErr(er); } render(); });
  }
  function cloudClick(a) {
    if (a === 'acforgot') { cloudForgot(); return true; }
    if (a === 'rcclose') { recov = null; render(); return true; }
    if (a === 'acsync') { lastPull = 0; cloudSync(); return true; }
    if (a === 'acout') { if (!arm('logout')) return true; cloudLogout(); return true; }
    if (a === 'acdel') { if (!arm('delacct')) return true; cloudDelete(); return true; }
    if (a === 'acmine') { sync.conflict = null; cloudPush(); return true; }
    if (a === 'actheirs') { var r = sync.conflict; sync.conflict = null; if (r) applyRemote(r); setSt('ok'); render(); return true; }
    return false;
  }
  function accountCard() {
    if (!cloudOn || !auth) return '';
    var st = sync.st, tm = '', dirty = lsGet(CD) === '1';
    try { if (sync.at) tm = new Date(sync.at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); } catch (e) {}
    var line = st === 'sync' ? 'Synchronisation…' : st === 'err' ? 'Pas synchronisé : ' + esc(sync.err) + ' Nouvel essai automatique.' : st === 'conflict' ? '' : tm ? 'Sauvegardé en ligne à ' + tm + '.' : 'Connecté.';
    var h = '<section class="card"><h3>Mon compte</h3><p class="sub">Connecté avec <b>' + esc(auth.email) + '</b></p>';
    if (sync.conflict) {
      h += '<p class="err" role="alert">Cet appareil et ton compte contiennent des données différentes. Lesquelles garder ?</p>' +
        '<div class="btns"><button class="btn primary" data-act="acmine">Garder cet appareil</button><button class="btn" data-act="actheirs">Prendre celles du compte</button></div>' +
        '<p class="hint">Si tu prends celles du compte, une copie de cet appareil est gardée de côté.</p>';
    } else {
      h += '<p class="' + (st === 'err' ? 'err' : 'sub') + '" role="status">' + line + '</p>' +
        '<div class="btns"><button class="btn" data-act="acsync"' + (acct.busy ? ' disabled' : '') + '>Synchroniser maintenant</button>' +
        '<button class="btn ' + (armKey === 'logout' ? 'armed' : '') + '" data-act="acout"' + (acct.busy ? ' disabled' : '') + '>' + (armKey === 'logout' ? 'Confirmer la déconnexion' : 'Se déconnecter') + '</button></div>' +
        (armKey === 'logout' && dirty ? '<p class="err">Des changements ne sont pas encore en ligne. Ils seront envoyés avant la déconnexion si internet fonctionne.</p>' : '');
    }
    h += (acct.err ? '<p class="err" role="alert">' + esc(acct.err) + '</p>' : '') +
      '<details class="danger-zone"' + (armKey === 'delacct' || dzOpen ? ' open' : '') + '><summary>Supprimer mon compte</summary><p class="sub">Ton compte et toutes tes données en ligne seront effacés définitivement. Pense à exporter tes données avant.</p>' +
      '<button class="btn ' + (armKey === 'delacct' ? 'armed' : 'danger') + '" data-act="acdel"' + (acct.busy ? ' disabled' : '') + '>' + (armKey === 'delacct' ? 'Confirmer : supprimer définitivement' : 'Supprimer mon compte') + '</button></details>';
    return h + '</section>';
  }
  function cloudBoot() {
    if (auth && cloudOn && !S.owner) { S.owner = auth.uid; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
    if (auth && cloudOn && !S.profile.done && !S.items.length) { booting = true; render(); }
    lastSer = ser(); recoveryInit(); if (recov || acct.err) render();
    updCheck();
    if (auth && cloudOn) cloudSync();
  }
  document.addEventListener('visibilitychange', function () {
    if (!auth || !cloudOn) return;
    if (document.hidden) { if (lsGet(CD) === '1' && !sync.conflict) { clearTimeout(pushT); cloudPush(); } }
    else if (Date.now() - lastPull > 20000) cloudSync();
  });
  window.addEventListener('online', function () { if (auth && cloudOn) cloudSync(); });


  /* ---------- nouvelle version ---------- */
  var updVer = 0, updT = 0;
  function updCheck() {
    try {
      if (navigator.onLine === false || Date.now() - updT < 60000) return; updT = Date.now();
      fetch(location.pathname + '?chk=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (tx) {
        var m = /var APP_VER = (\d+)/.exec(tx || '');
        if (m && +m[1] > APP_VER && +m[1] !== updVer) { updVer = +m[1]; if (!editing() && !sheet) render(); }
      }).catch(function () {});
    } catch (e) {}
  }
  function updBanner() { return updVer ? '<div class="note"><span>Une nouvelle version de Cadence est disponible.</span><button class="btn sm primary" data-act="updnow">Mettre à jour</button></div>' : ''; }
  function updNow() {
    function go() { location.replace(location.pathname + '?v=' + updVer); }
    try {
      var p = [];
      if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      Promise.all(p).then(go, go);
    } catch (e) { go(); }
  }

  try { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(function (r) { swReg = r; }).catch(function () {});
    navigator.serviceWorker.ready.then(function (r) { swReg = r; }).catch(function () {});
  } } catch (e) {}

  applyTheme();
  render();
  cloudBoot();
  setInterval(function () { timerLoop(); if (todayISO() !== lastDay) { var was = lastDay; lastDay = todayISO(); if (cur === was) cur = lastDay; if (!editing() && !sheet) render(); } }, 1000);
  
})();
</script>
