<style>
/* Layout: une colonne de lecture (720px), clair et épuré. Une carte d'action unique en haut d'Aujourd'hui, cases rondes pour terminer d'un tap, navigation fixe en bas à 5 onglets. */
:root {
  --bg: #F5F3FF; --surface: #FFFFFF; --soft: #EEEBFB; --ink: #17142B; --muted: #6B6785; --line: #E6E2F6;
  --accent: #5B4BFF; --accent-ink: #FFFFFF; --accent-soft: #E9E6FF;
  --warn: #B45309; --warn-soft: #FEF3C7; --bad: #D92D4B; --ok: #0E9F6E;
  --streak-bg: #FFF1E6; --streak-ink: #E8590C;
  --grad: linear-gradient(135deg, #5B4BFF 0%, #8B5CF6 55%, #EC4899 135%); --grad2: linear-gradient(135deg, #12B981, #2E9BE6);
  --shadow: 0 1px 2px rgba(40, 30, 120, .05), 0 10px 26px -14px rgba(40, 30, 120, .22), 0 0 0 1px var(--line);
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0D1F; --surface: #1A1733; --soft: #26224A; --ink: #EEEBFF; --muted: #A29DC4; --line: #2E2A57; --accent: #8B7CFF; --accent-ink: #0F0D1F; --accent-soft: #28235A; --warn: #F0B45A; --warn-soft: #33260F; --bad: #FF8A9B; --ok: #4ADE9F; --streak-bg: #3A2412; --streak-ink: #FFA35C; --shadow: 0 0 0 1px var(--line); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0D1F; --surface: #1A1733; --soft: #26224A; --ink: #EEEBFF; --muted: #A29DC4; --line: #2E2A57; --accent: #8B7CFF; --accent-ink: #0F0D1F; --accent-soft: #28235A; --warn: #F0B45A; --warn-soft: #33260F; --bad: #FF8A9B; --ok: #4ADE9F; --streak-bg: #3A2412; --streak-ink: #FFA35C; --shadow: 0 0 0 1px var(--line); color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 18px 130px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1.1; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
h2.big { font-size: 28px; overflow-wrap: anywhere; }
h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); }
small.sub { display: block; font-size: 13px; font-weight: 400; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top .hd { display: grid; gap: 2px; min-width: 0; }
.top p { color: var(--muted); font-size: 14px; }
.top p::first-letter { text-transform: uppercase; }
.tools { display: flex; gap: 8px; flex: none; }
.iconbtn { width: 46px; height: 46px; border-radius: 14px; border: 0; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.iconbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.iconbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


.summary { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 14px; }
.summary b { color: var(--ink); font-weight: 600; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.panel h3.title { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.panel.focus { background: var(--accent); color: var(--accent-ink); }
.panel.focus .eyebrow, .panel.focus .why { color: var(--accent-ink); opacity: .85; }
.panel.focus .btn { background: rgba(255, 255, 255, .18); color: var(--accent-ink); }
.panel.focus .btn.primary { background: var(--accent-ink); color: var(--accent); }
.panel.hero-old { background: var(--accent); color: var(--accent-ink); padding: 22px 20px; gap: 14px; }
.panel.hero .eyebrow, .panel.hero .hint { color: var(--accent-ink); opacity: .8; }
.panel.hero .btn { background: rgba(255, 255, 255, .18); color: var(--accent-ink); }
.panel.hero .btn.primary { background: var(--accent-ink); color: var(--accent); }
.clock { font-size: 44px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.cue { font-size: 14px; color: var(--accent); font-weight: 600; }
.coach { display: grid; gap: 8px; }
.msg { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start; font-size: 14px; color: var(--muted); }
.msg i { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--accent); }
.msg.warn i { background: var(--warn); }
.msg.ok i { background: var(--ok); }
.notice { background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; font-size: 14px; display: flex; gap: 12px; justify-content: space-between; align-items: center; }
.notice.warn { background: var(--warn-soft); }
.notice .btns { flex: none; }

.qa { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px 12px; margin: 0; }
.qa dt { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: .7; font-weight: 600; padding-top: 4px; }
.qa dd { margin: 0; overflow-wrap: anywhere; font-size: 15px; }
.qa dd.q { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.15; }
.qa dd.mute { opacity: .7; }

.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 8px; align-items: center; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 8px 4px 4px; }
.trow.event { background: var(--soft); box-shadow: none; padding: 10px 14px; display: flex; gap: 12px; color: var(--muted); align-items: baseline; }
.trow.pause { background: none; box-shadow: none; padding: 2px 14px; display: flex; gap: 12px; color: var(--muted); font-size: 14px; }
.rowbtn { display: flex; align-items: center; gap: 12px; min-height: 54px; width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 6px 10px; cursor: pointer; min-width: 0; border-radius: 12px; }
.rowbtn .t { font-family: var(--font-mono); font-size: 13px; color: var(--muted); flex: none; width: 46px; }
.rowbtn .ti { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.rowbtn .ti small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.rowbtn.sel .ti { color: var(--accent); }
.row { display: flex; gap: 10px; justify-content: space-between; align-items: start; min-width: 0; }
.row h3 { overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.why { font-size: 14px; }

.btn { font: inherit; font-weight: 600; font-size: 15px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--soft); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 56px; font-size: 17px; width: 100%; }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--accent); padding: 0 10px; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.group { display: grid; gap: 10px; }
.group h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.item { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.item p { font-size: 14px; color: var(--muted); }
.line { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 6px; align-items: center; }
.more { display: grid; gap: 10px; padding: 2px 4px 6px; }
form, .form { display: grid; gap: 14px; }
.quick { display: flex; gap: 8px; align-items: center; }
.quick input { flex: 1; }
label.f, .f { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type="text"], input[type="time"], input[type="date"], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 48px; padding: 0 14px; width: 100%; min-width: 0;
}
textarea { padding: 12px 14px; min-height: 112px; resize: vertical; line-height: 1.45; }
textarea.s { min-height: 72px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .tg { font: inherit; font-size: 15px; font-weight: 500; min-height: 46px; padding: 0 14px; border-radius: 14px; border: 0; background: var(--soft); color: var(--ink); cursor: pointer; }
.tg { min-height: 44px; font-size: 14px; }
.seg button.on, .tg[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--accent); }
.seg.sm button { min-height: 40px; font-size: 14px; padding: 0 12px; }
.err { color: var(--bad); font-size: 14px; }
.badge { font-size: 13px; font-weight: 600; color: var(--warn); }
.empty { color: var(--muted); }
.done-t { text-decoration: line-through; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
.qh { display: flex; align-items: center; gap: 8px; }
.qh i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.q1 i { background: var(--bad); } .q2 i { background: var(--accent); } .q3 i { background: var(--warn); } .q4 i { background: var(--muted); }
.qh .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.qh .d { font-weight: 400; color: var(--muted); font-size: 14px; }
.ask { display: grid; gap: 6px; }
.ask .lab { font-size: 14px; font-weight: 600; color: var(--muted); }

.sw-row { align-items: center; }
.sw { flex: none; width: 54px; height: 32px; border-radius: 16px; border: 0; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); position: relative; cursor: pointer; padding: 0; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); }
.sw.on { background: var(--accent); box-shadow: none; }
.sw.on::after { left: 26px; background: var(--accent-ink); }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar.over i { background: var(--warn); }
.day { display: grid; gap: 6px; }
.dtask { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.dtask span:first-child { min-width: 0; overflow-wrap: anywhere; }
.hist { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
.hist div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
.hist div.hot { opacity: 1; }
.hlab { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.cat { display: grid; grid-template-columns: minmax(0, 112px) 1fr 62px; gap: 10px; align-items: center; font-size: 14px; }
.cat span:last-child { text-align: right; }
.hrow { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; }
.chk { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; padding: 0; justify-self: center; }
.chk svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.star { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; justify-self: center; }
.star svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.star[aria-pressed="true"] { color: var(--accent); }
.star[aria-pressed="true"] svg { fill: currentColor; }
details.panel > summary { cursor: pointer; font-weight: 600; min-height: 36px; }
.lead { font-size: 14px; color: var(--muted); }
.step { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 4px 10px; align-items: start; }
.step.wait { opacity: .6; }
.pct { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.alert { color: var(--warn); font-weight: 600; font-size: 14px; }
.cmdmsg { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; overflow-wrap: anywhere; }
.cmdmsg.warn { background: var(--warn-soft); }
@media (prefers-reduced-motion: no-preference) { .btn, .seg button, .tg, .sw, .sw::after, .chk, .star { transition: background .15s, left .15s; } }

.mrow { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 70px; padding: 12px 16px; border: 0; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font: inherit; text-align: left; color: inherit; cursor: pointer; }
.mrow svg { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mrow b { display: block; font-weight: 600; }
.mrow small { display: block; color: var(--muted); font-size: 13px; }
.back { justify-self: start; padding: 0 4px; margin-bottom: -8px; }

/* Focus : écran plein écran, anneau, mini-barre */
body.noscroll { overflow: hidden; }
.fscreen { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.fbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
.fkind { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.fgap { width: 46px; flex: none; }
.fmain { flex: 1; display: grid; align-content: center; justify-items: center; gap: 16px; text-align: center; max-width: 560px; width: 100%; margin: 0 auto; padding: 12px 0; min-height: 0; }
.ring { position: relative; width: min(74vw, 290px); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rbg { fill: none; stroke: var(--soft); stroke-width: 5; }
.rfg { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
.fscreen.brk .rfg { stroke: var(--ok); }
.ringtxt { position: absolute; inset: 0; display: grid; place-content: center; }
.ringtxt .clock { font-size: 52px; }
.rdone { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.rdone svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ftask { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; overflow-wrap: anywhere; text-wrap: balance; }
.fhint { max-width: 36ch; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); }
.dots i.on { background: var(--accent); box-shadow: none; }
.fact { display: grid; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto; }
.fact .row3 { display: flex; gap: 8px; }
.fact .row3 .btn { flex: 1; padding: 0 8px; }
.mini { position: fixed; left: 50%; transform: translateX(-50%); width: min(calc(100% - 28px), 720px); bottom: calc(66px + env(safe-area-inset-bottom, 0px) + 10px); z-index: 8; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 18px; border: 0; border-radius: 26px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); }
.mini i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-ink); flex: none; }
.mini .mt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
details.rest > summary { cursor: pointer; color: var(--accent); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details.rest[open] > summary { margin-bottom: 8px; }
.ver { text-align: center; }

/* ===== v9 : coloré et motivant ===== */
body { padding-block: 14px 150px; }
.wrap { gap: 16px; }
.top { padding-top: 6px; }
.top .back { margin: 0; min-height: 44px; padding: 0 4px; font-size: 16px; }
.top h1 { font-size: 30px; line-height: 1.05; }
.top .eyebrow { text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; }
.top .eyebrow::first-letter { text-transform: uppercase; }
.streak { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: var(--surface); box-shadow: var(--shadow); font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; flex: none; }
.streak svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.streak.on { background: var(--streak-bg); color: var(--streak-ink); }
.panel, .card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.item { border-radius: 18px; }
.btn.primary { background: var(--grad); color: #fff; }
.btn { border-radius: 16px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 2px; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { position: relative; flex: 1; min-width: 0; display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 54px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 12px; padding: 5px 0; }
.nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] svg { stroke-width: 2.2; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: -6px; width: 30px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.fab { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(66px + 16px + env(safe-area-inset-bottom, 0px)); z-index: 7; width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--grad); color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; box-shadow: 0 12px 28px -8px rgba(91, 75, 255, .65); }
