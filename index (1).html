<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: une colonne de lecture (720px), barre de navigation fixe en bas, bouton + de capture toujours à portée du pouce, carte "Maintenant" en tête de journée. */
:root {
  --bg: #EDF0F1;
  --surface: #FFFFFF;
  --surface2: #E3E8EA;
  --ink: #0F1E26;
  --muted: #56686F;
  --line: #D2DADD;
  --accent: #0B6B73;
  --accent-ink: #FFFFFF;
  --accent-soft: #D6ECEE;
  --warn: #8A5200;
  --warn-soft: #FBEBCF;
  --bad: #B3261E;
  --ok: #1F7A4D;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C151A; --surface: #121F26; --surface2: #1A2B33; --ink: #E6EEF1; --muted: #8FA3AC; --line: #243640;
    --accent: #5CC8CF; --accent-ink: #06262A; --accent-soft: #123940; --warn: #F0B45A; --warn-soft: #33260F; --bad: #F2877F; --ok: #62C48F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C151A; --surface: #121F26; --surface2: #1A2B33; --ink: #E6EEF1; --muted: #8FA3AC; --line: #243640;
  --accent: #5CC8CF; --accent-ink: #06262A; --accent-soft: #123940; --warn: #F0B45A; --warn-soft: #33260F; --bad: #F2877F; --ok: #62C48F;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.015em; line-height: 1.15; text-wrap: balance; }
h2.big { font-size: 26px; overflow-wrap: anywhere; }
h3 { font-size: 15px; font-weight: 600; line-height: 1.3; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); }
small.sub { display: block; font-size: 12px; font-weight: 400; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top p { color: var(--muted); font-size: 13px; }
.top p::first-letter { text-transform: uppercase; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 2px; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 2px; min-height: 52px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 4px 0; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(82px + env(safe-area-inset-bottom, 0px)); z-index: 7; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0, 0, 0, .28); }
.fab svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.scrim { position: fixed; inset: 0; z-index: 8; background: rgba(0, 0, 0, .45); border: 0; padding: 0; }
.sheet { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 0 0 14px 14px; padding-block: 14px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
.sheet form { max-width: 720px; margin: 0 auto; }

.summary { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; }
.summary b { color: var(--ink); font-weight: 600; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.panel h3.title { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.panel.now { border-color: var(--accent); gap: 12px; }
.panel.focus { border-color: var(--accent); }
.clock { font-size: 40px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.cue { font-size: 14px; color: var(--accent); font-weight: 600; }
.coach { display: grid; gap: 10px; }
.msg { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.msg i { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--accent); }
.msg.warn i { background: var(--warn); }
.msg.ok i { background: var(--ok); }
.notice { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; display: flex; gap: 12px; justify-content: space-between; align-items: start; }
.notice.warn { background: var(--warn-soft); }
.notice .btns { flex: none; }

.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.blk { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
.blk .t { display: grid; align-content: start; font-family: var(--font-mono); font-size: 13px; padding-top: 12px; font-variant-numeric: tabular-nums; }
.blk .t span + span { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.row { display: flex; gap: 10px; justify-content: space-between; align-items: start; min-width: 0; }
.row h3 { overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.why { font-size: 14px; }
.blk.pause .card { background: transparent; border-style: dashed; color: var(--muted); padding-block: 8px; }
.blk.event .card { background: repeating-linear-gradient(135deg, var(--surface2) 0 8px, var(--bg) 8px 16px); border-style: dashed; }

.btn { font: inherit; font-weight: 600; font-size: 14px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.group { display: grid; gap: 8px; }
.group h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 6px; min-width: 0; }
.item p { font-size: 14px; color: var(--muted); }
form, .form { display: grid; gap: 12px; }
label.f, .f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type="text"], input[type="time"], input[type="date"], select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 10px; width: 100%; min-width: 0;
}
textarea { padding: 10px; min-height: 112px; resize: vertical; line-height: 1.45; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .tg { font: inherit; font-size: 14px; font-weight: 500; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.tg { min-height: 40px; font-size: 13px; }
.seg button.on, .tg[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.err { color: var(--bad); font-size: 13px; }
.rank { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.badge { font-size: 12px; font-weight: 600; color: var(--warn); }
.empty { color: var(--muted); }
.done-t { text-decoration: line-through; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
.qh { display: flex; align-items: center; gap: 8px; }
.qh i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.q1 i { background: var(--bad); } .q2 i { background: var(--accent); } .q3 i { background: var(--warn); } .q4 i { background: var(--muted); }
.qh .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.ask { display: grid; gap: 6px; }
.ask .lab { font-size: 13px; font-weight: 600; color: var(--muted); }

.sw-row { align-items: center; }
.sw { flex: none; width: 52px; height: 32px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface2); position: relative; cursor: pointer; padding: 0; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); }
.sw.on { background: var(--accent); border-color: var(--accent); }
.sw.on::after { left: 24px; background: var(--accent-ink); }
.bar { height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.over i { background: var(--warn); }
.day { display: grid; gap: 6px; }
.dtask { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.dtask span:first-child { min-width: 0; overflow-wrap: anywhere; }
.hist { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
.hist div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
.hist div.hot { opacity: 1; }
.hlab { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.cat { display: grid; grid-template-columns: 112px 1fr 60px; gap: 8px; align-items: center; font-size: 13px; }
.cat span:last-child { text-align: right; }
.hrow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; }
.chk { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
.chk svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.chk[aria-pressed="true"] svg { opacity: 1; }
details.panel > summary { cursor: pointer; font-weight: 600; min-height: 32px; }
.btn.big { min-height: 58px; font-size: 17px; width: 100%; }
.panel.hero { border-color: var(--accent); }
.iconbtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.iconbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.iconbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.top { align-items: center; flex-wrap: nowrap; }
.top .hd { display: grid; gap: 0; min-width: 0; }
.qa { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px 12px; margin: 0; }
.qa dt { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 3px; }
.qa dd { margin: 0; overflow-wrap: anywhere; }
.qa dd.q { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.2; }
.qa dd.mute { color: var(--muted); }
textarea.s { min-height: 72px; }
.lead { font-size: 13px; color: var(--muted); }
.step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.step.wait { opacity: .6; }
.pct { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.alert { color: var(--warn); font-weight: 600; font-size: 13px; }
.cmdmsg { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; overflow-wrap: anywhere; }
.cmdmsg.warn { background: var(--warn-soft); }
@media (prefers-reduced-motion: no-preference) { .btn, .seg button, .tg, .sw, .sw::after, .chk { transition: background .15s, border-color .15s, left .15s; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  'use strict';
  var KEY = 'cadence.v4', KEY3 = 'cadence.v3', KEY2 = 'cadence.v2';
  var app = document.getElementById('app');
  var DOMS = ['Travail', 'Santé', 'Sport', 'Finances', 'Relations', 'Apprentissage', 'Loisirs', 'Développement', 'Repos'];
  var DOMTAG = { 'Travail': 'travail', 'Santé': 'sante', 'Sport': 'sport', 'Finances': 'finances', 'Relations': 'relations', 'Apprentissage': 'apprentissage', 'Loisirs': 'loisirs', 'Développement': 'dev', 'Repos': 'repos' };
  var DOMALIAS = { pro: 'Travail', boulot: 'Travail', famille: 'Relations', amis: 'Relations', argent: 'Finances', perso: 'Développement', detente: 'Repos' };
  var HZ = { q: 'Ce trimestre', y: 'Cette année', l: 'Long terme (3 à 10 ans)' };
  var PSTAT = { active: 'Actif', paused: 'En pause', done: 'Terminé', dropped: 'Abandonné' };
  var PEAK = { matin: [480, 720], aprem: [780, 1020], soir: [1080, 1320] };
  var PEAKLBL = { matin: 'Matin', aprem: 'Après-midi', soir: 'Soir' };
  var ENLBL = { basse: 'Basse', moyenne: 'Normale', haute: 'Haute' };
  var EFF = ['', 'Léger', 'Moyen', 'Exigeant'];
  var REP = { once: 'Une fois', daily: 'Tous les jours', weekdays: 'Jours ouvrés', weekly: 'Chaque semaine' };
  var RECL = { '': 'Ne se répète pas', d: 'Chaque jour', w: 'Chaque semaine' };
  var PARTS = { matin: 'Matin', jour: 'Journée', soir: 'Soir' };
  var QUAD = {
    1: { n: 'Faire', d: 'Urgent et important' },
    2: { n: 'Planifier', d: 'Important, pas urgent' },
    3: { n: 'Déléguer', d: 'Urgent, pas important' },
    4: { n: 'Éliminer', d: 'Ni urgent ni important' }
  };
  var ICONS = {
    plan: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    matrix: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    habits: '<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>',

    projects: '<path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>',
    life: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
    settings: '<path d="M5 7h14M5 17h14"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/>'
  };
  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  /* ---------- Utilitaires ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function p2(n) { return String(n).padStart(2, '0'); }
  function toMin(h) { var p = String(h).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function fmt(m) { m = Math.max(0, Math.round(m)); return p2(Math.floor(m / 60)) + ':' + p2(m % 60); }
  function dur(d) { d = Math.round(d); if (d < 60) return d + ' min'; var h = Math.floor(d / 60), r = d % 60; return r ? h + ' h ' + p2(r) : h + ' h'; }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function iso(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function parseISO(s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function diffDays(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 864e5); }
  function dow(s) { var d = parseISO(s).getDay(); return d === 0 ? 7 : d; }
  function weekStart(s) { return addDays(s, 1 - dow(s)); }
  function dayLabel(s, long) { try { return parseISO(s).toLocaleDateString('fr-FR', long ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short', day: 'numeric' }); } catch (e) { return s; } }
  function todayISO() { return iso(new Date()); }

  /* ---------- État ---------- */
  function defaults() { return { theme: 'auto', notif: { block: true, morning: true, review: true, focus: true } }; }
  function ensure(s) {
    s.v = 4;
    s.ctx = Object.assign({ start: '09:00', end: '18:00', energie: 'moyenne', peak: 'matin', goal: '', pause: 15, auto: true, review: '20:30', margin: 20 }, s.ctx || {});
    s.tasks = (s.tasks || []).map(function (t) { return Object.assign({ id: uid(), title: '', dur: 30, i: null, u: null, effort: 2, deleg: false, due: '', dom: '', rec: '', hold: '', cue: '', starDay: '', postponed: 0, done: false, pid: '', sid: '' }, t); });
    s.vision = Object.assign({ y1: '', y3: '', y5: '', y10: '' }, s.vision || {});

    s.life = s.life || {}; s.life.track = s.life.track || {};

    s.goals = s.goals || []; s.history = s.history || []; s.habits = s.habits || []; s.hlog = s.hlog || {}; s.wins = s.wins || []; s.wnotes = s.wnotes || [];

    return s;
  }
  var DOMMAP = { Clients: 'Pro', Marketing: 'Pro', Admin: 'Pro', Production: 'Pro', Perso: 'Perso' };
  /* v2 -> forme v3 (domaines Pro/Santé/Famille/Argent/Perso) */
  function migrate(o) {
    if (!o || o.sample || !Array.isArray(o.tasks) || !o.ctx) return null;

  function findStep(sid) {

  }
  function submitLines(id) {
    var el = document.getElementById(id), v = el ? el.value : '';

    save(); capOpen = false;
    var inbox = S.tasks.filter(function (t) { return !t.done && unsorted(t); }).length;
    notice = { warn: false, text: n + ' idée' + (n > 1 ? 's' : '') + ' ajoutée' + (n > 1 ? 's' : '') + '.' + (inbox ? ' Trie-les en 30 secondes.' : ''), go: inbox ? 'matrix' : '', goLabel: 'Trier' };
    var f = {}; f[id] = ''; render(f);
  }

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === 'taskform') submitTask();
    else if (id === 'brainform') submitLines('brain');
    else if (id === 'capform') submitLines('cap-text');
    else if (id === 'cmdform') { var ci = document.getElementById('cmd-text'); cmdMsg = runCommand(ci ? ci.value : ''); render({ 'cmd-text': '' }); }
    else if (id === 'projform') submitProject();
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, id = b.dataset.id, f = b.dataset.f, v = b.dataset.v, t, before, out;
    var key = a + ':' + (id || '');
    if (armKey && armKey !== key) { armKey = ''; clearTimeout(armTimer); }
    function arm() {
      if (armKey === key) { armKey = ''; clearTimeout(armTimer); return true; }
      armKey = key; clearTimeout(armTimer); armTimer = setTimeout(function () { armKey = ''; render(); }, 4000); render(); return false;
    }
    if (a === 'tab') { if (id === 'projects' && tab === 'projects') projOpen = null; tab = id; formErr = ''; capOpen = false; projForm = false; projEdit = null; if (id !== 'matrix') notice = (notice && notice.go ? null : notice); render(); window.scrollTo(0, 0); return; }
    if (a === 'dismiss') { notice = null; render(); return; }
    if (a === 'capopen') { capOpen = true; render(); return; }
    if (a === 'capclose') { capOpen = false; render(); return; }
    if (a === 'dseg') { draft[f] = (f === 'effort') ? +v : (v === '1'); render(); return; }
    if (a === 'dtog') { draft[f] = !draft[f]; render(); return; }
    if (a === 'hseg') { hpart = v; render(); return; }
    if (a === 'ctx') { S.ctx[f] = v; save(); render(); return; }
    if (a === 'theme') { S.settings.theme = v; applyTheme(); save(); render(); return; }
    if (a === 'peak') { S.ctx.peak = v; save(); render(); return; }
    if (a === 'newtask') { formOpen = true; render(resetForm()); return; }
    if (a === 'cancel') { editing = null; formOpen = false; draft = blankDraft(); formErr = ''; render(resetForm()); return; }
    if (a === 'due') { render({ 'f-due': v === '' ? '' : addDays(todayISO(), +v) }); return; }
    if (a === 'sw') {
      var k = b.dataset.k;
      if (k === 'auto') S.ctx.auto = !S.ctx.auto; else if (k && k.indexOf('n:') === 0) S.settings.notif[k.slice(2)] = !S.settings.notif[k.slice(2)];
      save(); render(); return;
    }
    if (a === 'edit') {
      t = byId(id); if (!t) return;
      editing = id; formOpen = true; draft = { i: t.i, u: t.u, effort: t.effort, deleg: t.deleg }; formErr = '';
      tab = 'matrix'; render({ 'f-title': t.title, 'f-dur': String(t.dur), 'f-due': t.due || '', 'f-dom': t.dom || '', 'f-rec': t.rec || '', 'f-cue': t.cue || '' }); window.scrollTo(0, 0); return;
    }
    if (a === 'del') {
      if (!arm()) return;
      S.tasks = S.tasks.filter(function (x) { return x.id !== id; }); if (editing === id) editing = null; if (S.focus && S.focus.id === id) S.focus = null; save(); render(); return;
    }
    if (a === 'seti') { t = byId(id); if (t) { t.i = (v === '1'); save(); render(); } return; }
    if (a === 'setu') { t = byId(id); if (t) { t.u = (v === '1'); save(); render(); } return; }
    if (a === 'tgi') { t = byId(id); if (t) { t.i = !(t.i === true); save(); render(); } return; }
    if (a === 'tgu') { t = byId(id); if (t) { t.u = !effUrgent(t, planCtx().pd); save(); render(); } return; }
    if (a === 'star') {
      t = byId(id); if (!t) return;
      var tom = tomorrowISO();
      if (t.starDay === tom) t.starDay = '';
      else if (S.tasks.filter(function (x) { return !x.done && x.starDay === tom; }).length >= 3) { notice = { warn: true, text: '3 priorités maximum pour demain. Retire-en une avant d’en ajouter.' }; render(); return; }
      else t.starDay = tom;
      save(); render(); return;
    }
    if (a === 'done') { notice = markDone(id); ask = null; save(); render(); return; }
    if (a === 'undo') { undoDone(id); notice = null; save(); render(); return; }
    if (a === 'push') { t = byId(id); if (t && t.due) { t.due = addDays(t.due < PC.pd ? PC.pd : t.due, 1); save(); render(); } return; }
    if (a === 'start' || a === 'focus' || a === 'fcont') {
      t = byId(id); if (!t) return;
      S.focus = { id: id, end: Date.now() + (a === 'start' ? 2 : t.dur) * 60000, alerted: false, mode: a === 'start' ? 'start' : 'full' }; ask = null; save(); render(); return;
    }
    if (a === 'fext') { if (S.focus) { S.focus.end = Math.max(S.focus.end, Date.now()) + 10 * 60000; S.focus.alerted = false; save(); render(); } return; }
    if (a === 'fdone') { notice = markDone(id); S.focus = null; ask = null; save(); render(); return; }
    if (a === 'fstop') { S.focus = null; ask = null; save(); render(); return; }
    if (a === 'split') {
      t = byId(id); if (!t) return;
      var nt = 'Première étape : ' + t.title;
      if (S.tasks.some(function (x) { return !x.done && x.title === nt; })) { notice = { warn: false, text: 'Cette tâche est déjà découpée : la première étape est dans ta liste.' }; render(); return; }
      S.tasks.push({ id: uid(), title: nt, dur: 15, i: t.i, u: t.u, effort: 1, deleg: false, due: t.due, dom: t.dom, rec: '', hold: '', cue: t.cue, starDay: '', postponed: 0, done: false });
      save(); notice = { warn: false, text: 'Première étape de 15 minutes ajoutée. Commence par elle.' }; render(); return;
    }
    if (a === 'now') {
      var d = new Date(), nowM = Math.ceil((d.getHours() * 60 + d.getMinutes()) / 5) * 5;
      if (nowM > toMin(S.ctx.start) && nowM < toMin(S.ctx.end) - 15) {
        before = ids(); S.ctx.start = fmt(nowM); save();
        out = pushedOut(before);
        notice = { warn: out.length > 0, text: 'Plan recalculé à partir de ' + S.ctx.start + '.' + (out.length ? ' Je repousse : ' + out.join(', ') + '.' : '') };
      } else notice = { warn: false, text: 'Il est ' + fmt(d.getHours() * 60 + d.getMinutes()) + ' : en dehors de ta plage ou trop proche de la fin. Ajuste-la dans Réglages.' };
      render(); return;
    }
    if (a === 'urgent') {
      var title = (document.getElementById('u-title').value || '').trim();
      if (!title) { notice = { warn: true, text: 'Décris l’urgence pour que je la place.' }; render(); return; }
      before = ids();
      S.tasks.push({ id: uid(), title: title, dur: +document.getElementById('u-dur').value || 30, i: true, u: true, effort: 2, deleg: false, due: PC.pd, dom: '', rec: '', hold: '', cue: '', starDay: '', postponed: 0, done: false }); save();
      out = pushedOut(before);
      notice = { warn: out.length > 0, text: '« ' + title + ' » passe en premier.' + (out.length ? ' Je repousse : ' + out.join(', ') + '.' : ' Le reste tient encore.') };
      render({ 'u-title': '' }); window.scrollTo(0, 0); return;
    }
    if (a === 'close') {
      if (!arm()) return;
      var r = closeDay(todayISO()); save();
      notice = { warn: false, text: 'Journée clôturée : ' + r.done + ' tâche' + (r.done > 1 ? 's' : '') + ' terminée' + (r.done > 1 ? 's' : '') + ', ' + r.rest + ' reportée' + (r.rest > 1 ? 's' : '') + '. Bonne soirée.' };
      render(); return;
    }
    if (a === 'wadd') {
      var wt = (document.getElementById('w-text').value || '').trim(); if (!wt) return;
      if (S.wins.filter(function (w) { return w.d === todayISO(); }).length >= 3) return;
      S.wins.push({ d: todayISO(), text: wt }); if (S.wins.length > 400) S.wins = S.wins.slice(-400); save(); render({ 'w-text': '' }); return;
    }
    if (a === 'wdel') {
      var todays = S.wins.filter(function (w) { return w.d === todayISO(); }), target = todays[+id];
      if (target) { S.wins.splice(S.wins.indexOf(target), 1); save(); render(); } return;
    }
    if (a === 'wkadd') {
      var kt = (document.getElementById('wk-text').value || '').trim(); if (!kt) return;
      var ws = weekStart(todayISO()); S.wnotes = S.wnotes.filter(function (n) { return n.w !== ws; }); S.wnotes.push({ w: ws, text: kt }); save(); render({ 'wk-text': '' }); return;
    }
    if (a === 'addev') {
      var lab = (document.getElementById('e-label').value || '').trim(), es = document.getElementById('e-start').value, ee = document.getElementById('e-end').value;
      var rep = document.getElementById('e-rep').value, dt = document.getElementById('e-date').value || todayISO();

    }

    if (a === 'gadd') {
      var gt = (document.getElementById('g-text').value || '').trim(), gp = document.getElementById('g-per').value;
      if (!gt) { formErr = 'Écris ton objectif.'; render(); return; }
      if (S.goals.filter(function (x) { return x.per === gp; }).length >= 3) { formErr = '3 objectifs maximum par période. Retire-en un avant d’en ajouter.'; render(); return; }
      formErr = ''; S.goals.push({ id: uid(), text: gt, per: gp, done: false }); save(); render({ 'g-text': '' }); return;
    }
    if (a === 'gtog') { var g = S.goals.filter(function (x) { return x.id === id; })[0]; if (g) { g.done = !g.done; save(); render(); } return; }
    if (a === 'gdel') { if (!arm()) return; S.goals = S.goals.filter(function (x) { return x.id !== id; }); save(); render(); return; }

      var hn = (document.getElementById('h-name').value || '').trim(), hc = (document.getElementById('h-cue').value || '').trim();
      if (!hn) { formErr = 'Donne un nom à l’habitude.'; render(); return; }

    }
    if (a === 'htog') {
      var arr = S.hlog[id] || [], td = todayISO(), ix = arr.indexOf(td);
      if (ix >= 0) arr.splice(ix, 1); else arr.push(td);
      S.hlog[id] = arr.slice(-400); save(); render(); return;
    }
    if (a === 'hdel') { if (!arm()) return; S.habits = S.habits.filter(function (x) { return x.id !== id; }); delete S.hlog[id]; save(); render(); return; }
    if (a === 'ask') { ask = { i: 0, win: 0 }; render(); return; }
    if (a === 'askall') { ask = { i: 0, win: 0 }; render(); return; }
    if (a === 'askmore') { if (ask) ask.i++; render(); return; }
    if (a === 'askclose') { ask = null; render(); return; }
    if (a === 'cmdtog') { cmdOpen = !cmdOpen; render(); return; }
    if (a === 'cmdrun') { cmdMsg = runCommand(v); render(); return; }
    if (a === 'lifetab') { lifeTab = v; formErr = ''; render(); return; }
    if (a === 'dtrack') { S.life.track[id] = !S.life.track[id]; save(); render(); return; }

    if (a === 'visave') {
      ['y1', 'y3', 'y5', 'y10'].forEach(function (k) { var el = document.getElementById('v-' + k); if (el) S.vision[k] = el.value.trim(); });
      save(); notice = { warn: false, text: 'Vision enregistrée.' }; render(); window.scrollTo(0, 0); return;
    }
    if (a === 'oadd') {
      var ot = (document.getElementById('o-text').value || '').trim(), oh = document.getElementById('o-hz').value, od = document.getElementById('o-dom').value;

      if (S.objs.filter(function (x) { return x.hz === oh && !x.done; }).length >= 3) { formErr = '3 objectifs maximum par horizon. Termine ou retire-en un avant d’en ajouter.'; render(); return; }
      formErr = ''; S.objs.push({ id: uid(), text: ot, hz: oh, dom: od, done: false }); save(); render({ 'o-text': '' }); return;
    }
    if (a === 'ogtog') { var og = objById(id); if (og) { og.done = !og.done; save(); render(); } return; }
    if (a === 'odel') {
      if (!arm()) return;
      S.objs = S.objs.filter(function (x) { return x.id !== id; }); S.projects.forEach(function (p) { if (p.oid === id) p.oid = ''; }); save(); render(); return;
    }
    if (a === 'pnew') { projForm = true; projEdit = null; projSeq = true; formErr = ''; render({ 'p-name': '', 'p-obj': '', 'p-dom': '', 'p-due': '' }); return; }
    if (a === 'pcancel') { projForm = false; projEdit = null; formErr = ''; render(); return; }
    if (a === 'pseqf') { projSeq = !projSeq; render(); return; }
    if (a === 'popen') { projOpen = id; projForm = false; projEdit = null; render(); window.scrollTo(0, 0); return; }
    if (a === 'pback') { projOpen = null; render(); window.scrollTo(0, 0); return; }
    if (a === 'pfilter') { pfilter = v; render(); return; }
    if (a === 'pedit') {
      var pe = projById(id); if (!pe) return;
      projEdit = id; projForm = true; projSeq = pe.seq; formErr = '';
      render({ 'p-name': pe.name, 'p-obj': pe.oid || '', 'p-dom': pe.dom || '', 'p-due': pe.due || '' }); window.scrollTo(0, 0); return;
    }
    if (a === 'pseq') { var ps = projById(id); if (ps) { ps.seq = !ps.seq; save(); render(); } return; }
    if (a === 'pstat') {
      var pp = projById(id); if (!pp) return;
      pp.status = v; pfilter = v === 'active' ? 'active' : (v === 'paused' ? 'paused' : 'closed'); save();
      notice = { warn: false, text: v === 'done' ? 'Projet terminé. Bravo.' : v === 'paused' ? 'Projet en pause : ses tâches quittent ton plan jusqu’à la reprise.' : v === 'dropped' ? 'Projet abandonné. Ses tâches quittent ton plan.' : 'Projet réactivé.' };
      render(); window.scrollTo(0, 0); return;
    }
    if (a === 'pdel') {
      if (!arm()) return;
      var gone = {}; S.tasks.forEach(function (x) { if (x.pid === id && !x.done) gone[x.id] = true; });
      S.tasks = S.tasks.filter(function (x) { return !gone[x.id]; }); if (S.focus && gone[S.focus.id]) S.focus = null;
      S.projects = S.projects.filter(function (x) { return x.id !== id; }); projOpen = null; save(); render(); window.scrollTo(0, 0); return;
    }
    if (a === 'stplan') {
      var fp = findStep(id); if (!fp || fp.st.done || fp.p.status !== 'active') return;
      if (nextSteps(fp.p).indexOf(fp.st) < 0) return;
      planStep(fp.p, fp.st); save();
      notice = { warn: false, text: '« ' + fp.st.text + ' » est au plan. Elle apparaît dans Aujourd’hui.' }; render(); return;
    }

      var ft = findStep(id); if (!ft) return;

      save(); render(); return;

      if (to >= 0 && to < fm.p.steps.length) { var tmp = fm.p.steps[to]; fm.p.steps[to] = fm.p.steps[fm.j]; fm.p.steps[fm.j] = tmp; save(); render(); }

        line = line.trim(); if (!line || pa.steps.length >= 60) return;

    if (a === 'blank') {

    }

          if (o && o.v === 4 && Array.isArray(o.tasks) && o.ctx) n = ensure(o); else if (o && o.v === 3 && Array.isArray(o.tasks) && o.ctx) n = ensure(migrate3(o)); else { var m = migrate(o); if (m) { m = migrate3(m); if (m) n = ensure(m); } }
          if (!n) throw new Error('x');
          S = n; ask = null; cmdMsg = null; projOpen = null; projForm = false; projEdit = null; save(); applyTheme(); formErr = ''; notice = { warn: false, text: 'Sauvegarde importée.' }; tab = 'plan';
        } catch (err) { formErr = 'Import impossible : fichier non reconnu.'; }

  try { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(function (r) { swReg = r; }).catch(function () {});
    navigator.serviceWorker.ready.then(function (r) { swReg = r; }).catch(function () {});
  } } catch (e) {}

  applyTheme();
  rollover();
  save();
  render();
  try { if (/[?&]add=1/.test(location.search)) { capOpen = true; render(); } } catch (e) {}
  var sec = 0;
  setInterval(function () { updateFocus(); sec++; if (sec % 30 === 0) tick(); }, 1000);
  setTimeout(tick, 1500);
  
})();
